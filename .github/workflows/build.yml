name: Build AevumJobs
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: aevumjobs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build plugin
        run: mvn -B clean package
      - name: Upload installable jar
        uses: actions/upload-artifact@v4
        with:
          name: AevumJobs
          path: target/AevumJobs-*.jar
